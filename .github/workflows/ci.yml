name: 🤖 Playwright AI Agent CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_prompt:
        description: "Natural language test scenario to run"
        required: false
        default: "Go to https://playwright.dev and verify the page title contains Playwright"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 🤖 Run AI Test Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PROMPT="${{ github.event.inputs.test_prompt || 'Go to https://playwright.dev and verify the page title contains Playwright' }}"
          node agent/testAgent.js "$PROMPT"
      - name: 📊 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14
